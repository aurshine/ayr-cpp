name: C++ CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu 24.04 / GCC 13 / Debug
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-13 g++-13 ninja-build libssl-dev libfmt-dev

      - name: Verify compiler
        run: |
          "$CC" --version
          "$CXX" --version

      - name: Build and test
        run: bash test/RunTest.sh Debug

  windows:
    name: Windows 2022 / MSVC / Debug
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine vcpkg version
        id: vcpkg-version
        shell: pwsh
        run: |
          $commit = git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ steps.vcpkg-version.outputs.commit }}-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ steps.vcpkg-version.outputs.commit }}-

      - name: Install dependencies
        run: vcpkg install openssl fmt

      - name: Build and test
        shell: pwsh
        run: |
          $env:CMAKE_TOOLCHAIN_FILE = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          ./test/RunTest.ps1 -Config Debug
