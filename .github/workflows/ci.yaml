name: C++ CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu 24.04 / GCC 13 / Debug
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-13 g++-13 ninja-build libssl-dev libfmt-dev

      - name: Verify compiler
        run: |
          "$CC" --version
          "$CXX" --version

      - name: Build and test
        run: bash test/RunTest.sh Debug

  windows:
    name: Windows 2022 / MSVC / Debug
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: vcpkg install openssl fmt

      - name: Build and test
        shell: pwsh
        run: |
          $env:CMAKE_TOOLCHAIN_FILE = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          ./test/RunTest.ps1 -Config Debug
